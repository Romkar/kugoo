<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kugoo Kirin R1 BLE Control</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-blue { background: #007bff; color: white; }
        .btn-green { background: #28a745; color: white; }
        input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        #log { background: #222; color: #00ff00; padding: 10px; border-radius: 4px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 12px; margin-top: 15px; }
        .status { font-weight: bold; color: #dc3545; text-align: center; margin: 10px 0; }
        .status.ok { color: #28a745; }
    </style>
</head>
<body>

<div class="card">
    <h3>Управление Kugoo Kirin R1</h3>
    
    <!-- Шаг 0: Локальный пароль для защиты самого HTML интерфейса -->
    <label for="html_pass">1. Введите пароль доступа к Bluetooth самоката:</label>
    <input type="password" id="html_pass" placeholder="Введите ваш текущий BLE пароль (6 цифр)" maxlength="6">

    <div id="status_label" class="status">Статус: Отключено</div>

    <button class="btn-blue" onclick="connectAndAuth()">1. Подключиться и Авторизоваться</button>
    
    <hr>
    
    <label for="new_pin">2. Новый ПИН-код блокировки колес (4 цифры):</label>
    <input type="text" id="new_pin" placeholder="Например: 7777" maxlength="4">
    <button class="btn-green" onclick="changeLockPin()">2. Отправить новый ПИН на самокат</button>

    <h4>Лог работы:</h4>
    <div id="log"></div>
</div>

<script>
let bleDevice = null;
let gattServer = null;
let writeCharacteristic = null;

function log(text) {
    const logDiv = document.getElementById('log');
    logDiv.innerHTML += `> ${text}<br>`;
    logDiv.scrollTop = logDiv.scrollHeight;
}

function updateStatus(text, isOk = false) {
    const statusLabel = document.getElementById('status_label');
    statusLabel.innerText = "Статус: " + text;
    if (isOk) { statusLabel.classList.add('ok'); } else { statusLabel.classList.remove('ok'); }
}

function stringToBytes(str) {
    return new TextEncoder().encode(str);
}

async function connectAndAuth() {
    const passInput = document.getElementById('html_pass').value.trim();
    if (passInput.length !== 6 || isNaN(passInput)) {
        alert("Ошибка: Введите 6-значный цифровой пароль!");
        return;
    }

    try {
        log("Запуск сканирования ВСЕХ сервисов самоката...");
        
        // requestDevice без фильтра по конкретному UUID, чтобы увидеть всё
        bleDevice = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'Kugoo' }, { namePrefix: 'Kirin' }],
            acceptAllDevices: false,
            optionalServices: [] // Оставляем пустым, Chrome запросит базовые, либо используем хак ниже
        });

        // ХАК ДЛЯ CHROME: Чтобы заставить его искать вообще все сервисы, 
        // если верхний вариант выдаст ошибку, используйте acceptAllDevices: true ниже (вместо верхнего requestDevice):
        /*
        bleDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true
        });
        */

        log(`Подключение к ${bleDevice.name}...`);
        gattServer = await bleDevice.gatt.connect();
        
        log("Поиск абсолютно всех первичных сервисов (GATT)...");
        const services = await gattServer.getPrimaryServices();
        
        if (services.length === 0) {
            log("Ошибка: На устройстве не найдено открытых GATT-сервисов!");
            return;
        }

        log(`Найдено сервисов: ${services.length}. Список UUID:`);
        for (let service of services) {
            log(`[Сервис] UUID: ${service.uuid}`);
            
            // Пробуем получить характеристики этого сервиса
            try {
                let characteristics = await service.getCharacteristics();
                for (let char of characteristics) {
                    log(`   └─ [Характеристика] UUID: ${char.uuid} (Write: ${char.properties.write})`);
                    // Если нашли характеристику с правами на запись, запоминаем её как рабочую
                    if (char.properties.write || char.properties.writeWithoutResponse) {
                        writeCharacteristic = char;
                    }
                }
            } catch(e) {}
        }

        if (writeCharacteristic) {
            log(`Автоматически выбрана рабочая характеристика: ${writeCharacteristic.uuid}`);
            log(`Отправка CODE=${passInput}...`);
            await writeCharacteristic.writeValue(stringToBytes("CODE=" + passInput));
            log("Авторизация отправлена!");
            updateStatus("Подключен", true);
        } else {
            log("Не найдено подходящей характеристики для записи (TX)!");
        }
        
    } catch (error) {
        log(`Ошибка: ${error.message}`);
        updateStatus("Ошибка соединения");
    }
}

async function changeLockPin() {
    if (!writeCharacteristic) {
        alert("Сначала авторизуйтесь!");
        return;
    }
    const newPin = document.getElementById('new_pin').value.trim();
    try {
        log(`Отправка LKSC+${newPin}...`);
        await writeCharacteristic.writeValue(stringToBytes("LKSC+" + newPin));
        log("Выполнено!");
    } catch (error) {
        log(`Ошибка: ${error.message}`);
    }
}
</script>

</body>
</html>
